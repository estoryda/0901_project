<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 프로필 | DEV.LOG</title>
  <meta name="description" content="사용자 프로필 정보, 작성한 아티클 목록 및 북마크 활동 내역입니다.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

  <!-- Fonts -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/blog.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- 스크롤 진행 바 -->
  <div id="scroll-progress" class="scroll-progress"></div>

  <!-- 상단 헤더 & 네비게이션 -->
  <header id="header" class="header">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-dot"></span>
        <span>DEV.LOG</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">홈</a></li>
        <li><a href="posts.html" class="nav-link">게시글 목록</a></li>
        <li><a href="about.html" class="nav-link">소개</a></li>
        <!-- auth 아이템 동적 렌더링 -->
      </ul>

      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="테마 전환" title="테마 전환">🌙</button>
        <button id="menu-toggle" class="icon-btn menu-toggle" aria-label="메뉴 열기">☰</button>
      </div>
    </div>
  </header>

  <main style="padding-top: calc(var(--header-height) + 2rem);" id="profile-container">
    <div class="container" style="max-width: 960px;">
      <!-- Profile Header Card -->
      <section class="profile-header-card">
        <div class="profile-cover"></div>
        <div class="profile-user-bar">
          <div class="profile-avatar-group">
            <img id="profile-display-avatar" src="assets/images/profile.jpg" alt="프로필 아바타" class="profile-main-avatar">
            <div class="profile-title-area">
              <h1 id="profile-display-name" class="profile-name">홍길동</h1>
              <div style="display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;">
                <span id="profile-display-username" class="profile-username">@gildong_dev</span>
                <span id="profile-display-role" class="section-tag" style="padding: 0.15rem 0.6rem; font-size: 0.75rem; margin: 0;">Frontend Engineer</span>
                <span id="profile-display-joined" style="font-size: 0.8rem; color: var(--text-muted);">가입일: 2025-01-15</span>
              </div>
            </div>
          </div>

          <div style="display: flex; gap: 0.6rem;">
            <button id="profile-logout-btn" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
              로그아웃
            </button>
          </div>
        </div>

        <div class="profile-bio-box">
          <p id="profile-display-bio">
            사용자 경험과 클린 코드를 사랑하는 프론트엔드 개발자입니다. 기술과 배움을 기록합니다.
          </p>
        </div>

        <!-- Activity Stats -->
        <div class="profile-stats-grid">
          <div class="stat-box">
            <div id="stat-my-posts" class="stat-number">0</div>
            <div class="stat-label">작성한 글</div>
          </div>
          <div class="stat-box">
            <div id="stat-likes-received" class="stat-number">0</div>
            <div class="stat-label">받은 추천수</div>
          </div>
          <div class="stat-box">
            <div id="stat-bookmarked" class="stat-number">0</div>
            <div class="stat-label">좋아요한 글</div>
          </div>
          <div class="stat-box">
            <div id="stat-my-comments" class="stat-number">0</div>
            <div class="stat-label">작성한 댓글</div>
          </div>
        </div>
      </section>

      <!-- Profile Tabs Navigation -->
      <nav class="profile-tabs-nav">
        <button type="button" class="profile-tab-btn active" data-tab="my-posts">내 게시글</button>
        <button type="button" class="profile-tab-btn" data-tab="liked-posts">좋아요한 글</button>
        <button type="button" class="profile-tab-btn" data-tab="my-comments">작성 댓글</button>
        <button type="button" class="profile-tab-btn" data-tab="settings">프로필 설정</button>
      </nav>

      <!-- Tab Panes -->
      <!-- 1. My Posts Tab -->
      <div id="tab-my-posts" class="tab-pane active">
        <div id="my-posts-container"></div>
      </div>

      <!-- 2. Liked Posts Tab -->
      <div id="tab-liked-posts" class="tab-pane">
        <div id="liked-posts-container"></div>
      </div>

      <!-- 3. My Comments Tab -->
      <div id="tab-my-comments" class="tab-pane">
        <div id="my-comments-container"></div>
      </div>

      <!-- 4. Settings & Edit Tab -->
      <div id="tab-settings" class="tab-pane">
        <div class="sidebar-widget" style="max-width: 600px;">
          <h3 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem;">회원 정보 수정</h3>
          <form id="profile-edit-form">
            <div class="form-group">
              <label for="edit-email" class="form-label">이메일 계정 (수정 불가)</label>
              <input type="text" id="edit-email" class="form-input" disabled style="opacity: 0.7; cursor: not-allowed;">
            </div>
            <div class="form-group">
              <label for="edit-name" class="form-label">이름</label>
              <input type="text" id="edit-name" class="form-input" required>
            </div>
            <div class="form-group">
              <label for="edit-role" class="form-label">직무 / 타이틀</label>
              <input type="text" id="edit-role" class="form-input" placeholder="Frontend Engineer" required>
            </div>
            <div class="form-group">
              <label for="edit-bio" class="form-label">한 줄 소개 (Bio)</label>
              <textarea id="edit-bio" class="form-textarea" rows="3"></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
              <button type="submit" class="btn btn-primary">변경사항 저장</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- 하단 푸터 -->
  <footer class="footer">
    <div class="container footer-content">
      <div class="hero-socials">
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-link" title="GitHub">🐙</a>
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-link" title="LinkedIn">💼</a>
        <a href="posts.html" class="social-link" title="게시글 목록">📚</a>
      </div>
      <p class="footer-copyright">
        &copy; 2026 DEV.LOG. All rights reserved.
      </p>
    </div>
  </footer>

  <!-- 맨 위로 가기 버튼 -->
  <button id="back-to-top" class="back-to-top" aria-label="맨 위로 이동" title="맨 위로">↑</button>

  <!-- Toast 알림 팝업 -->
  <div id="toast" class="toast" role="alert"></div>

  <!-- Scripts -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
